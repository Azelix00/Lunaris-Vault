<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" style="text-decoration:none; color:inherit;">
        <div class="logo">Lunaris Vault</div>
    </a>
</header>
<section>
    <div class="form-container">
        <h2>Seller Registration</h2>

        <form onsubmit="registerSeller(event)">

            <label>Username *</label>
            <input type="text" id="registerUsername" required>

            <label>Email *</label>
            <input type="email" id="registerEmail" required>

            <label>Password *</label>
            <input type="password" id="registerPassword" required>

            <label>Bio</label>
            <textarea id="registerBio"></textarea>

            <label>Facebook(Optional)</label>
            <input type="text" id="registerFacebook">

            <label>Instagram(Optional)</label>
            <input type="text" id="registerInstagram">

            <button type="submit">Register</button>
        </form>

        <a href="index.html">
            <button class="back-button">Back</button>
        </a>
    </div>
</section>

    <footer>
      <h3>LUNARIS VAULT</h3>

      <p>Giving old collections a new home.</p>

      <p>Email: handitover@gmail.com</p>

      <p>© 2026 LUNARIS VAULT</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
