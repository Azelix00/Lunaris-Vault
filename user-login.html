
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login | Lunaris Vault</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="uprofile.css">
<head>
</head>
<body>

<header>
    <a href="index.html" style="text-decoration:none; color:inherit;">
        <div class="logo">Lunaris Vault</div>
    </a>
</header>

<section>
    <div class="form-container">
        <h2>User Login</h2>

        <!-- Profile Image Upload -->
        <div class="profile-upload">
            <div class="profile-preview">
                <span id="defaultAvatar">👤</span>
                <img id="previewImage" alt="Profile image preview">
            </div>

            <label for="profileImage" class="upload-button">
                Upload Profile Image
            </label>

            <input
                type="file"
                id="profileImage"
                accept="image/*"
            >

            <p id="uploadStatus">Choose an image from your device.</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="loginUser(event)">
            <label for="loginEmail">Email *</label>
            <input
                type="email"
                id="loginEmail"
                required
            >

            <label for="loginPassword">Password *</label>
            <input
                type="password"
                id="loginPassword"
                required
            >

            <button type="submit">Login</button>
        </form>

        <a href="index.html">
            <button type="button" class="back-button">Back</button>
        </a>
    </div>
</section>

<footer>
    <h3>LUNARIS VAULT</h3>
    <p>Giving old collections a new home.</p>
    <p>Email: handitover@gmail.com</p>
    <p>© 2026 LUNARIS VAULT</p>
</footer>

<script>
const profileInput = document.getElementById("profileImage");
const previewImage = document.getElementById("previewImage");
const defaultAvatar = document.getElementById("defaultAvatar");
const uploadStatus = document.getElementById("uploadStatus");

profileInput.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        this.value = "";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert("Please select an image smaller than 5 MB.");
        this.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {
        previewImage.src = event.target.result;
        previewImage.style.display = "block";
        defaultAvatar.style.display = "none";
        uploadStatus.textContent = file.name;
    };

    reader.readAsDataURL(file);
});
</script>

<script src="script.js"></script>
</body>
</html>
